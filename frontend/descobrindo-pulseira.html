<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Descobrindo a pulseira</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;800&display=swap">
<style>
  /* Layout: tela cheia azul LUMIS; textos de abertura em fade, depois o vídeo centralizado com "Pular" sempre à mão. */
  :root {
    --bg: #050b1a;
    --blue: #003D9B;
    --ink: #FFFFFF;
    --soft: #C4D2FF;
    --btn: #FFFFFF;
    --btn-ink: #003D9B;
    --font-display: "Fredoka", "Trebuchet MS", sans-serif;
    --font-body: "Nunito", "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    overflow: hidden;
  }
  .stage {
    position: relative;
    height: 100%;
    display: grid;
    place-items: center;
  }
  .frame {
    width: min(100%, calc(100vh * 16 / 9));
    aspect-ratio: 16 / 9;
    background: #000;
    overflow: hidden;
    position: relative;
  }
  video { width: 100%; height: 100%; object-fit: contain; display: block; }

  /* Abertura */
  .intro {
    position: absolute; inset: 0;
    background: var(--blue);
    display: grid; place-items: center;
    padding: 24px;
    text-align: center;
    transition: opacity 900ms ease;
    z-index: 2;
  }
  .intro.gone { opacity: 0; pointer-events: none; }
  .intro p {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(30px, 6vw, 72px);
    line-height: 1.1;
    text-wrap: balance;
    opacity: 0;
    transition: opacity 1000ms ease;
  }
  .intro p.show { opacity: 1; }
  .intro p.second { font-weight: 500; color: var(--soft); font-size: clamp(26px, 5vw, 56px); }

  /* Botões */
  .skip {
    position: absolute;
    right: 14px;
    bottom: 14px;
    z-index: 5;
    font: 800 16px/1 var(--font-body);
    color: var(--ink);
    background: #00225f;
    border: 2px solid rgba(196, 210, 255, .45);
    border-radius: 999px;
    padding: 12px 22px;
    cursor: pointer;
    transition: opacity 400ms ease, background 200ms;
  }
  .skip:hover { background: #003D9B; }
  .skip.off { opacity: 0; pointer-events: none; }

  .feel {
    transform: translateY(8px);
    font: 600 clamp(18px, 2.8vw, 28px)/1 var(--font-display);
    color: var(--btn-ink);
    background: var(--btn);
    border: 0;
    border-radius: 999px;
    padding: .7em 1.5em;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 800ms ease, transform 800ms ease;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
    white-space: nowrap;
  }
  .feel.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .feel.show { animation: pulse 2s ease-in-out 1s infinite; }
  .feel.done { animation: shake .45s linear 2; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(196,210,255,.7), 0 8px 24px rgba(0,0,0,.35); } 50% { box-shadow: 0 0 0 16px rgba(196,210,255,0), 0 8px 24px rgba(0,0,0,.35); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .actions {
    position: absolute;
    left: 0; right: 0; bottom: 7%;
    z-index: 3;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    gap: 16px;
    padding: 0 16px;
    pointer-events: none;
  }
  .again {
    font: 600 clamp(15px, 2vw, 20px)/1.2 var(--font-display);
    color: var(--ink);
    background: none;
    border: 0;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 6px;
    text-shadow: 0 1px 8px rgba(0, 0, 0, .6);
    padding: .3em .6em;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 800ms ease, background 200ms;
    white-space: nowrap;
  }
  .again.show { opacity: 1; pointer-events: auto; }
  .again:hover { text-decoration-thickness: 2px; }
  button:focus-visible { outline: 3px solid var(--soft); outline-offset: 3px; }

  .sound {
    position: absolute; top: 12px; right: 12px; z-index: 3;
    font: 800 14px/1 var(--font-body);
    color: var(--ink);
    background: rgba(0, 0, 0, .45);
    border: 0; border-radius: 999px; padding: 9px 14px; cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    .intro, .intro p, .feel, .skip { transition-duration: 1ms; }
    .feel.show, .feel.done { animation: none; }
  }
</style>

<main class="stage">
  <div class="frame">
    <video id="v" src="assets/video-pulseira.mp4" playsinline preload="auto"></video>
    <div class="intro" id="intro" aria-live="polite">
      <p id="t1">Descobrindo a pulseira</p>
      <p id="t2" class="second" style="position:absolute;inset:0;display:grid;place-items:center;padding:24px">Vamos colocar a pulseira</p>
    </div>
    <div class="actions">
      <button class="feel" id="feel" type="button">Ir para o mapa</button>
      <button class="again" id="again" type="button">Assistir novamente e sentir a vibração</button>
    </div>
    <button class="skip" id="skip" type="button">Pular &rsaquo;</button>
  </div>
</main>

<script>
(function () {
  var v = document.getElementById('v');
  var intro = document.getElementById('intro');
  var t1 = document.getElementById('t1');
  var t2 = document.getElementById('t2');
  var skip = document.getElementById('skip');
  var feel = document.getElementById('feel');
  var again = document.getElementById('again');
  var timers = [];
  var finished = false;
  var vibrarAoFim = false;

  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function clearAll() { timers.forEach(clearTimeout); timers = []; }

  // Conexão com a pulseira (Python no Raspberry, localhost:5001)
  var API = "http://localhost:5001";
  function vibrarPulseira(padrao) {
    return fetch(API + "/api/pulseira/vibrar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ padrao: padrao })
    }).catch(function () {});
  }

  function vibrar() {
    vibrarPulseira("comemorar");   // vibração de parabéns na pulseira de verdade
    try { if (navigator.vibrate) navigator.vibrate([200, 80, 200]); } catch (e) {}  // reserva do celular
  }

  function showEnd() {
    finished = true;
    skip.classList.add('off');
    feel.classList.add('show');
    again.classList.add('show');
    // Quando aparecem "Ir para o mapa" / "Assistir novamente", a pulseira vibra (comemorar)
    vibrarAoFim = false;
    vibrar();
  }

  function playVideo() {
    intro.classList.add('gone');
    v.currentTime = 0;
    var p = v.play();
    if (p && p.catch) {
      p.catch(function () {
        v.muted = true;
        v.play().catch(function () {});
      });
    }
  }

  // Sequência: 1) título  2) "colocar a pulseira"  3) vídeo  4) botão no último frame
  later(function () { t1.classList.add('show'); }, 300);
  later(function () { t1.classList.remove('show'); }, 3600);
  later(function () { t2.classList.add('show'); }, 4700);
  later(function () { t2.classList.remove('show'); }, 7600);
  later(playVideo, 8600);

  v.addEventListener('ended', showEnd);

  // Pular: vai direto ao último frame do vídeo, parado, com o botão
  skip.addEventListener('click', function () {
    if (finished) return;
    clearAll();
    t1.classList.remove('show');
    t2.classList.remove('show');
    intro.classList.add('gone');
    function goLast() {
      v.pause();
      v.currentTime = Math.max(0, (v.duration || 0) - 0.05);
      showEnd();
    }
    if (v.readyState >= 1) goLast();
    else v.addEventListener('loadedmetadata', goLast, { once: true });
  });

  // Assistir de novo: volta ao início do vídeo, sem repetir a abertura
  again.addEventListener('click', function () {
    finished = false;
    vibrarAoFim = true;
    feel.classList.remove('show');
    again.classList.remove('show');
    skip.classList.remove('off');
    v.currentTime = 0;
    var p = v.play();
    if (p && p.catch) p.catch(function () {});
  });

  // Ir para o mapa
  feel.addEventListener('click', function () {
    location.href = '../mapa.html';
  });
})();
</script>

</body></html>
