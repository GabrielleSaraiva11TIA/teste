<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUMIS · Etapa 6 · Presente do Lumis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --azul:#003D9B; --azul-vivo:#2563EB; --azul-claro:#C4D2FF; --azul-fundo:#F1F5FF; --azul-suave:#E6EDFF;
    --ciano:#38BDF8; --ouro:#FBBF24; --texto-suave:#6B7390; --branco:#FFFFFF; --raio:22px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Quicksand',system-ui,sans-serif;background:var(--azul-fundo);color:var(--azul);display:flex;justify-content:center}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  button:focus-visible{outline:3px solid var(--azul-vivo);outline-offset:3px}
  .app{position:relative;width:100%;max-width:1024px;min-height:600px;height:100vh;padding:14px 18px 16px;display:flex;flex-direction:column;gap:12px}

  /* cabeçalho padrão */
  .topo{display:flex;justify-content:space-between;align-items:center}
  .pill{background:var(--branco);border-radius:999px;padding:9px 22px;font-weight:700;font-size:15px;color:var(--azul);box-shadow:0 2px 10px rgba(0,61,155,.06)}
  .pill.estrelas{display:flex;align-items:center;gap:8px}
  .pill.estrelas svg{width:16px;height:16px}
  .pill.estrelas.bump{animation:bump .5s ease}
  @keyframes bump{40%{transform:scale(1.12)}}
  .progresso{background:var(--branco);border-radius:var(--raio);padding:12px 20px 10px;box-shadow:0 2px 10px rgba(0,61,155,.06)}
  .progresso-titulo{display:flex;justify-content:space-between;font-weight:700;font-size:15px;margin-bottom:8px}
  .etapas{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
  .etapa{text-align:center;font-size:11px;font-weight:600;color:#8E94B0}
  .etapa i{display:block;height:9px;border-radius:99px;background:var(--azul-fundo);margin-bottom:5px}
  .etapa.feita i{background:var(--azul-vivo)}
  .etapa.atual i{background:var(--azul-vivo);box-shadow:0 3px 8px rgba(37,99,235,.4)}
  .etapa.atual{color:var(--azul);font-weight:700}

  /* palco */
  .palco{flex:1;min-height:0;display:grid;grid-template-columns:270px 1fr;gap:14px}
  .lumis{background:var(--branco);border-radius:var(--raio);padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 2px 10px rgba(0,61,155,.06)}
  .balao{background:var(--azul-fundo);border-radius:16px;padding:12px 14px;font-size:14px;font-weight:600;line-height:1.35;min-height:92px}
  .balao small{display:block;font-size:11px;font-weight:700;color:var(--azul-vivo);margin-bottom:3px;letter-spacing:.3px}
  .balao b{color:var(--azul-vivo)}
  .orbe-area{flex:1;display:grid;place-items:center;min-height:0}
  .orbe{width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff 0%,var(--azul-claro) 45%,#8FB0FF 100%);box-shadow:0 0 40px rgba(37,99,235,.35);animation:respira 3.6s ease-in-out infinite;transition:box-shadow .2s}
  .orbe.ouvindo{animation:none;transform:scale(calc(1 + var(--nivel,0) * .35));box-shadow:0 0 calc(30px + var(--nivel,0) * 70px) rgba(37,99,235,.55)}
  .orbe.festa{animation:festa .8s ease 2}
  @keyframes respira{50%{transform:scale(1.1)}}
  @keyframes festa{50%{transform:scale(1.28)}}
  .dica{font-size:12px;font-weight:600;color:var(--texto-suave);background:var(--azul-fundo);border-radius:14px;padding:9px 12px;line-height:1.35}

  .jogo{background:var(--branco);border-radius:var(--raio);padding:16px 20px;display:flex;flex-direction:column;gap:10px;min-height:0;box-shadow:0 2px 10px rgba(0,61,155,.06)}
  .jogo-topo{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
  .eyebrow{font-size:11px;font-weight:700;color:var(--texto-suave);letter-spacing:.8px;text-transform:uppercase}
  .jogo h1{font-size:24px;line-height:1.1;margin-top:2px}
  .vibra{display:flex;align-items:center;gap:6px;background:var(--azul-fundo);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700}
  .vibra.buzz svg{animation:buzz .12s 6}
  @keyframes buzz{50%{transform:translateX(2px) rotate(8deg)}}

  /* baú */
  .cena{flex:1;min-height:0;display:grid;place-items:center;background:var(--azul-fundo);border-radius:20px;position:relative;overflow:hidden}
  .bau{position:relative;width:min(230px,100%)}
  .bau svg.presente{width:100%;height:auto;overflow:visible;display:block}
  .bau .tampa{transform-origin:50% 100%;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
  .bau.aberto .tampa{transform:translate(18px,-26px) rotate(24deg)}
  .bau.tremendo svg.presente{animation:treme .25s linear infinite}
  @keyframes treme{25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
  .bau .cad{transform-origin:60px 78px;transition:transform .3s,opacity .3s}
  .bau.aberto .cad{transform:scale(0);opacity:0}
  .brilho-bau{position:absolute;left:50%;top:48%;width:230px;height:230px;margin:-115px 0 0 -115px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,.55),transparent 65%);opacity:0;transition:opacity .6s;pointer-events:none}
  .bau.aberto .brilho-bau{opacity:1}
  .surpresa{position:absolute;left:50%;top:28%;width:90px;height:90px;transform:translate(-50%,-50%) scale(0);opacity:0}
  .bau.aberto .surpresa{animation:surge .9s cubic-bezier(.3,1.5,.5,1) forwards}
  @keyframes surge{0%{transform:translate(-50%,0) scale(0);opacity:0}60%{transform:translate(-50%,-90%) scale(1.3);opacity:1}100%{transform:translate(-50%,-75%) scale(1.1);opacity:1}}
  .brilho{position:absolute;width:10px;height:10px;border-radius:50%;opacity:0;pointer-events:none;left:50%;top:30%}
  .bau.aberto .brilho{animation:brilha .9s ease-out forwards}
  @keyframes brilha{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}

  /* barra de segurar */
  .base{display:flex;flex-direction:column;gap:10px}
  .segurar{display:flex;align-items:center;gap:12px;background:var(--azul-fundo);border-radius:20px;padding:12px 16px}
  .som-chip{display:flex;align-items:center;gap:6px;background:var(--azul-vivo);color:var(--azul-claro);font-weight:700;font-size:16px;padding:5px 14px 5px 9px;border-radius:999px;white-space:nowrap}
  .trilho{flex:1;height:26px;background:var(--branco);border-radius:99px;overflow:hidden;border:3px solid var(--azul-claro);position:relative}
  .enche{height:100%;width:calc(var(--p,0) * 100%);background:linear-gradient(90deg,var(--azul-vivo),var(--ciano));border-radius:99px;transition:width .1s linear}
  .meta{width:38px;height:38px;flex:none;transition:transform .3s}
  .meta path{fill:var(--azul-claro);transition:fill .3s}
  .meta.on path{fill:var(--ouro)}
  .meta.on{animation:pop .7s}
  @keyframes pop{40%{transform:scale(1.5) rotate(15deg)}}
  .status{text-align:center;font-size:12px;font-weight:700;color:var(--texto-suave);min-height:16px}
  .controles{display:flex;gap:10px;align-items:center}
  .btn-mic{flex:1;background:var(--azul-vivo);color:var(--azul-claro);border-radius:999px;padding:14px 22px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 16px rgba(37,99,235,.3);transition:transform .15s,opacity .2s}
  .btn-mic:hover:not(:disabled){transform:translateY(-1px)}
  .btn-mic:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
  .btn-mic.ouvindo{background:var(--azul);animation:pulsa 1.2s ease infinite}
  @keyframes pulsa{50%{box-shadow:0 0 0 10px rgba(37,99,235,.18)}}
  .btn-sec{background:var(--azul-suave);color:var(--azul);border-radius:999px;padding:13px 20px;font-weight:700;font-size:14px;white-space:nowrap}
  .btn-sec:disabled{opacity:.45;cursor:not-allowed}
  .btn-continuar{flex:1;background:var(--azul);color:var(--azul-claro);border-radius:999px;padding:14px 22px;font-weight:700;font-size:16px;box-shadow:0 6px 16px rgba(0,61,155,.3);animation:entra .5s ease}
  @keyframes entra{from{opacity:0;transform:translateY(8px)}}
  [hidden]{display:none!important}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* gatinho Lumis */
  .orbe{width:auto;height:auto;border-radius:0;background:none;box-shadow:none;animation:flutua 4s ease-in-out infinite;transition:filter .2s}
  .orbe img{height:190px;width:auto;display:block;filter:drop-shadow(0 8px 12px rgba(0,61,155,.22));user-select:none;-webkit-user-drag:none}
  .orbe.ouvindo{animation:none;box-shadow:none;transform:scale(calc(1 + var(--nivel,0) * .07));filter:drop-shadow(0 0 calc(8px + var(--nivel,0) * 30px) rgba(37,99,235,.65))}
  .orbe.festa{animation:festa2 .8s ease 2}
  @keyframes flutua{50%{transform:translateY(-6px)}}
  @keyframes festa2{40%{transform:translateY(-16px) rotate(-4deg) scale(1.05)}70%{transform:translateY(0) rotate(3deg)}}
  /* baú e enfeites */
  .cena{display:flex;align-items:center;justify-content:center;padding:8px;overflow:visible}
  .bau{height:100%;max-height:200px;aspect-ratio:120/110;width:auto}
  .bau svg.presente{width:100%;height:100%}
  .surpresa{width:70px;height:70px}
  @keyframes surge{0%{transform:translate(-50%,0) scale(0);opacity:0}60%{transform:translate(-50%,-70%) scale(1.3);opacity:1}100%{transform:translate(-50%,-55%) scale(1.1);opacity:1}}
  .enfeites{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:20px}
  .enfeites>*{position:absolute}
  .est{animation:brilha2 3s ease-in-out infinite}
  @keyframes brilha2{50%{transform:scale(1.35) rotate(12deg);opacity:.7}}
  .foguete{animation:balanca 3.5s ease-in-out infinite}
  .f2{animation-delay:1.2s}
  @keyframes balanca{50%{translate:0 -7px}}
  .chama{transform-origin:20px 58px;animation:chama .3s ease-in-out infinite alternate}
  @keyframes chama{to{transform:scaleY(1.35)}}
  .cena.festa .foguete{animation:decola 1.4s ease-in forwards}
  .cena.festa .est{animation-duration:.8s}
  @keyframes decola{to{translate:60px -220px;opacity:0}}

  /* gatinho em camadas: cabeça, corpo e rabo */
  .orbe{animation:none}
  .gato{position:relative;height:195px;aspect-ratio:516/869;transform-origin:50% 100%;animation:respira2 3.6s ease-in-out infinite;filter:drop-shadow(0 8px 12px rgba(0,61,155,.22))}
  .gato img{position:absolute;inset:0;width:100%;height:100%;display:block;filter:none;user-select:none;-webkit-user-drag:none}
  .g-head{position:absolute;inset:0;transform-origin:50% 50.3%;animation:cabeca 4.5s ease-in-out infinite}
  .g-tail{transform-origin:18% 88.6%;animation:rabo 2.8s ease-in-out infinite}
  .brilhinho{position:absolute;width:14%;opacity:0;transform:translate(-50%,-50%)}
  @keyframes respira2{50%{transform:scaleY(1.018)}}
  @keyframes cabeca{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2.5deg)}}
  @keyframes rabo{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}
  .orbe.ouvindo .g-head{animation:escuta .7s ease-in-out infinite alternate}
  .orbe.ouvindo .g-tail{animation-duration:1s}
  @keyframes escuta{from{transform:rotate(-6deg)}to{transform:rotate(-3deg)}}
  .orbe.festa{animation:none}
  .orbe.festa .gato{animation:pulo .9s ease-in-out 3}
  .orbe.festa .g-head{animation:cabecaFesta .45s ease-in-out infinite alternate}
  .orbe.festa .g-tail{animation:raboFesta .2s ease-in-out infinite alternate}
  .orbe.festa .brilhinho{animation:cintila .5s ease-in-out infinite}
  @keyframes pulo{0%{transform:scale(1,1)}15%{transform:scale(1.06,.92)}45%{transform:translateY(-34px) scale(.96,1.07)}75%{transform:scale(1.05,.94)}100%{transform:scale(1,1)}}
  @keyframes cabecaFesta{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
  @keyframes raboFesta{from{transform:rotate(-12deg)}to{transform:rotate(14deg)}}
  @keyframes cintila{0%,100%{opacity:0;transform:translate(-50%,-50%) scale(.3)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.1) rotate(20deg)}}
  .voa{position:absolute;width:36px;height:36px;z-index:9;pointer-events:none}
  .conf{position:absolute;width:9px;height:9px;border-radius:3px;z-index:8;pointer-events:none}
</style>
</head>

<div class="app" id="app">
  <header class="topo">
    <button class="pill" type="button" id="voltar">← Voltar para o mapa</button>
    <div class="pill estrelas" id="pillEstrelas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#003D9B" d="m12 2 2.9 6.6 7.1.7-5.3 4.8 1.5 7-6.2-3.6-6.2 3.6 1.5-7L2 9.3l7.1-.7z"/></svg>
      <span><b id="qtdEstrelas"></b> estrelas</span>

  </header>

  <section class="progresso" aria-label="Progresso da jornada">

  <main class="palco">

2-3.6-6.2 3.6 1.5-7L2 9.3l7.1-.7z"/></svg><svg class="est" style="left:68%;top:14%;width:16px;height:16px;animation-delay:0.3s" viewBox="0 0 24 24" aria-hidden="true"><path fill="#C4D2FF" d="m12 2 2.9 6.6 7.1.7-5.3 4.8 1.5 7-6.2-3.6-6.2 3.6 1.5-7L2 9.3l7.1-.7z"/></svg><svg class="est" style="left:78%;top:24%;width:24px;height:24px;animation-delay:0.9s" viewBox="0 0 24 24" aria-hidden="true"><path fill="#FBBF24" d="m12 2 2.9 6.6 7.1.7-5.3 4.8 1.5 7-6.2-3.6-6.2 3.6 1.5-7L2 9.3l7.1-.7z"/></svg><svg class="est" style="left:86%;top:72%;width:16px;height:16px;animation-delay:0.5s" viewBox="0 0 24 24" aria-hidden="true"><path fill="#2563EB" d="m12 2 2.9 6.6 7.1.7-5.3 4.8 1.5 7-6.2-3.6-6.2 3.6 1.5-7L2 9.3l7.1-.7z"/></svg><svg class="est" style="left:66%;top:70%;width:12px;height:12px;animation-delay:1.4s" viewBox="0 0 24 24" aria-hidden="true"><path fill="#FBBF24" d="m12 2 2.9 6.6 7.1.7-5.3 4.8 1.5 7-6.2-3.6-6.2 3.6 1.5-7L2 9.3l7.1-.7z"/></svg><svg class="est" style="left:42%;top:8%;width:12px;height:12px;animation-delay:1.2s" viewBox="0 0 24 24" aria-hidden="true"><path fill="#C4D2FF" d="m12 2 2.9 6.6 7.1.7-5.3 4.8 1.5 7-6.2-3.6-6.2 3.6 1.5-7L2 9.3l7.1-.7z"/></svg><svg class="lua" style="left:90%;top:10%" width="30" height="30" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z" fill="#C4D2FF" stroke="#2563EB" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
        <div class="bau" id="bau">
          <div class="brilho-bau"></div>
          <svg class="presente" viewBox="0 0 120 110" aria-label="Baú misterioso">
            <ellipse cx="60" cy="107" rx="46" ry="4" fill="#003D9B" opacity=".12"/>
            <rect x="14" y="48" width="92" height="58" rx="8" fill="#2563EB"/>
            <rect x="54" y="48" width="12" height="58" fill="#fff" opacity=".85"/>
            <g class="tampa">
              <rect x="8" y="32" width="104" height="20" rx="8" fill="#2563EB"/>
              <rect x="8" y="32" width="104" height="20" rx="8" fill="#000" opacity=".12"/>
              <rect x="54" y="32" width="12" height="20" fill="#fff" opacity=".85"/>
              <path d="M60 32c-18-22-34-12-26-4 6 6 20 4 26 4zM60 32c18-22 34-12 26-4-6 6-20 4-26 4z" fill="#fff" opacity=".9"/>
            </g>
            <g class="cad">
              <circle cx="60" cy="78" r="13" fill="#fff" stroke="#003D9B" stroke-width="3"/>
              <circle cx="60" cy="76" r="3.5" fill="#003D9B"/><rect x="58.5" y="77" width="3" height="7" rx="1.5" fill="#003D9B"/>
            </g>
          </svg>
          <div class="surpresa"><svg viewBox="0 0 24 24"><path fill="#FBBF24" stroke="#F59E0B" stroke-width="1" stroke-linejoin="round" d="m12 2 2.9 6.6 7.1.7-5.3 4.8 1.5 7-6.2-3.6-6.2 3.6 1.5-7L2 9.3l7.1-.7z"/></svg></div>
        </div>
      </div>

      <div class="base">
        <div class="segurar">
          <span class="som-chip" id="chip"></span>
          <div class="trilho" id="trilho" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div class="enche" id="enche"></div></div>
          <svg class="meta" id="meta" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 2.9 6.6 7.1.7-5.3 4.8 1.5 7-6.2-3.6-6.2 3.6 1.5-7L2 9.3l7.1-.7z"/></svg>
        </div>
        <div class="status" id="status" aria-live="polite"></div>
        <div class="controles" id="controles">
          <button class="btn-mic" type="button" id="btnMic">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
            <span id="btnMicTxt"></span>
          </button>
          <button class="btn-sec" type="button" id="btnSimular"></button>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
/* =========================================================
   PARÂMETROS DA ATIVIDADE (ajuste aqui, sem mexer no resto)
   ========================================================= */
const ETAPA_ATUAL = 6;
const ETAPAS = ['Som','Espelho','Eco','Ritmo','Amigos','Brincar','Desafio','Tesouro'];
const TITULO_ETAPA = 'Presente do Lumis';
const ESTRELAS_INICIAIS = 125;
const ESTRELAS_RECOMPENSA = 3;
const PULSEIRA_ATIVA = true;
const MOSTRAR_BOTAO_SIMULAR = true;   // deixe false na versão final
const URL_VOLTAR = '../mapa.html', URL_PROXIMA = 'atividade-007.html';

/* Som-alvo. hzMin/hzMax = faixa aproximada do "brilho" do som (centroide espectral).
   boca: 'sorriso' | 'fechada' | 'aberta' */
const ALVO = { rotulo:'Sss', texto:'Sssss…', boca:'sorriso', hzMin:3200, hzMax:8000,
               dica:'Ponha a mão na frente da boca e sinta o ventinho fresco!' };
const SENSIBILIDADE = 1.0;    // maior = percebe sons mais fracos
const RMS_MINIMO = 0.02;      // volume mínimo antes da sensibilidade
const SEGURAR_MS = 2500;      // tempo total de som para encher a barra
const DECAIMENTO = 0.5;       // velocidade com que a barra esvazia se a criança para (1 = igual à subida)
const RITMO_PARCIAL = 0.25;   // 0 = exige o som exato; 0.25 = qualquer voz também avança devagar
const JANELA_MS = 9000;       // sem progresso por esse tempo -> "tentar mais uma vez"
const T = {
  inicio:'Será que tem uma <b>estrela</b> aqui dentro? Segure o som para abrir a caixa!',
  ouvindo:'Isso! Segure o som até a barra encher…',
  tentar:'Vamos tentar mais uma vez?',
  pausa:'Tudo bem! Quando quiser, toque no microfone.',
  acerto:'Muito bem! Vamos continuar.',
  final:`Olha só! Você ganhou <b>${ESTRELAS_RECOMPENSA} estrelas</b>! Muito bem!`,
  semMic:'Não consegui ouvir o microfone. Use o botão de teste para continuar.',
  esperando:'Esperando seu som…', continue:'Isso, continue!', denovo:'Vamos de novo?', completo:'Estrelas desbloqueadas!',
  botaoFalar:`Fale: “${ALVO.texto}”`, botaoOuvindo:'Estou ouvindo…', simular:'Simular som certo', continuar:'Continuar a jornada →'
};
/* ========================================================= */

const $ = id => document.getElementById(id);
let estrelas = ESTRELAS_INICIAIS, ouvindo = false, concluido = false;

/* cabeçalho */
$('tituloEtapa').textContent = `Etapa ${ETAPA_ATUAL} de 8: ${TITULO_ETAPA}`;
$('etapas').innerHTML = ETAPAS.map((n,i)=>{ const k=i+1; return `<div class="etapa ${k<ETAPA_ATUAL?'feita':k===ETAPA_ATUAL?'atual':''}"><i></i>${k}. ${n}</div>`; }).join('');
$('qtdEstrelas').textContent = estrelas;
if(!PULSEIRA_ATIVA) $('vibra').hidden = true;
if(!MOSTRAR_BOTAO_SIMULAR) $('btnSimular').hidden = true;
$('btnSimular').textContent = T.simular;

const BOCA = {
  sorriso:'<path d="M4 10q8 6 16 0"/><path d="M8 13h8" stroke-dasharray="1 2.4"/>',
  fechada:'<path d="M4 12q8-5 16 0q-8 5-16 0z"/>',
  aberta:'<ellipse cx="12" cy="12" rx="6" ry="6"/>' };
$('chip').textContent = ALVO.rotulo;

const falar = html => { $('balao').innerHTML = `<small>Lumis:</small>${html}`; };
const status = t => { $('status').textContent = t; };
const micTxt = t => { $('btnMicTxt').textContent = t; };
function vibrar(p){
  if(!PULSEIRA_ATIVA) return;
  navigator.vibrate?.(p);
  const v = $('vibra'); v.classList.remove('buzz'); void v.offsetWidth; v.classList.add('buzz');
}
function barra(p){ $('enche').style.setProperty('--p', p); $('trilho').setAttribute('aria-valuenow', Math.round(p*100)); }

falar(T.inicio); micTxt(T.botaoFalar); status(T.esperando); $('dica').textContent = 'Dica: ' + ALVO.dica;

/* microfone: volume (RMS) + centroide espectral */
let ctx, analyser, stream, tempo, espectro, raf, tAnt, carga, ultimoProg;
$('btnMic').addEventListener('click', ()=> ouvindo ? parar(false) : iniciar());
$('btnSimular').addEventListener('click', ()=>{ if(!ouvindo && !concluido) sucesso(); });

async function iniciar(){
  if(concluido) return;
  try{
    if(!stream){
      stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      ctx = new (window.AudioContext||window.webkitAudioContext)();
      analyser = ctx.createAnalyser(); analyser.fftSize = 2048; analyser.smoothingTimeConstant = .4;
      ctx.createMediaStreamSource(stream).connect(analyser);
      tempo = new Float32Array(analyser.fftSize); espectro = new Float32Array(analyser.frequencyBinCount);
    }
    if(ctx.state==='suspended') await ctx.resume();
  }catch(err){ status('Microfone indisponível'); falar(T.semMic); return; }
  ouvindo = true; carga = 0; tAnt = ultimoProg = performance.now(); barra(0);
  $('btnMic').classList.add('ouvindo'); micTxt(T.botaoOuvindo);
  $('orbe').classList.add('ouvindo'); $('bau').classList.add('tremendo');
  $('btnSimular').disabled = true; status(T.esperando); falar(T.ouvindo);
  raf = requestAnimationFrame(laco);
}
function laco(agora){
  if(!ouvindo) return;
  const dt = agora - tAnt; tAnt = agora;
  analyser.getFloatTimeDomainData(tempo); analyser.getFloatFrequencyData(espectro);
  let soma = 0; for(const v of tempo) soma += v*v;
  const rms = Math.sqrt(soma/tempo.length), hz = ctx.sampleRate/analyser.fftSize;
  let num = 0, den = 0;
  for(let b = Math.floor(100/hz); b < 8000/hz; b++){ const m = Math.pow(10, espectro[b]/20); num += b*hz*m; den += m; }
  const centro = den ? num/den : 0;
  const voz = rms >= RMS_MINIMO/SENSIBILIDADE, certo = voz && centro >= ALVO.hzMin && centro <= ALVO.hzMax;
  const taxa = certo ? 1 : (voz ? RITMO_PARCIAL : -DECAIMENTO);
  carga = Math.max(0, carga + dt*taxa); if(taxa>0) ultimoProg = agora;
  const p = Math.min(1, carga/SEGURAR_MS), nivel = Math.min(1, rms*14);
  barra(p); $('orbe').style.setProperty('--nivel', nivel.toFixed(2));
  status(taxa>0 ? T.continue : T.esperando);
  if(p>=1) return sucesso();
  if(agora - ultimoProg > JANELA_MS) return parar(true);
  raf = requestAnimationFrame(laco);
}
function limparEscuta(){
  cancelAnimationFrame(raf); ouvindo = false;
  $('btnMic').classList.remove('ouvindo'); $('orbe').classList.remove('ouvindo'); $('orbe').style.removeProperty('--nivel');
  $('bau').classList.remove('tremendo');
}
/* sem nota: só convida a tentar de novo */
function parar(esgotou){
  limparEscuta(); barra(0); micTxt(T.botaoFalar);
  $('btnSimular').disabled = false; status(T.denovo);
  falar(esgotou ? T.tentar : T.pausa); if(esgotou) vibrar(80);
}

/* sucesso: o baú abre e a estrela é desbloqueada */
function sucesso(){
  limparEscuta(); concluido = true; barra(1);
  const bau = $('bau');
  for(let k=0;k<10;k++){
    const b = document.createElement('i'); b.className = 'brilho';
    const ang = k/10*Math.PI*2, d = 70+Math.random()*30;
    b.style.setProperty('--dx', Math.cos(ang)*d+'px'); b.style.setProperty('--dy', Math.sin(ang)*d+'px');
    b.style.background = k%2 ? '#FBBF24' : '#38BDF8'; bau.appendChild(b);
  }
  bau.classList.add('aberto'); $('meta').classList.add('on');
  vibrar([120,60,120,60,240,80,400]);
  chuvaDeEstrelas(); confete();
  $('orbe').classList.add('festa'); $('cena').classList.add('festa'); setTimeout(()=>$('orbe').classList.remove('festa'),3000);
  falar(T.final); status(T.completo); $('dica').textContent = 'Você segurou o som até o fim!';
  $('controles').innerHTML = `<button class="btn-continuar" type="button" id="continuar">${T.continuar}</button>`;
  $('continuar').addEventListener('click', ()=>{ if(URL_PROXIMA!=='#') location.href = URL_PROXIMA; parent.postMessage({lumis:'proxima-etapa'},'*'); });
}

/* as estrelas ganhas saem do baú, voam até o contador e somam uma a uma */
const STAR_D = 'm12 2 2.9 6.6 7.1.7-5.3 4.8 1.5 7-6.2-3.6-6.2 3.6 1.5-7L2 9.3l7.1-.7z';
function posicao(el){ const a = $('app').getBoundingClientRect(), r = el.getBoundingClientRect(); return {x:r.left-a.left+r.width/2, y:r.top-a.top+r.height/2}; }
function chuvaDeEstrelas(){
  const de = posicao($('bau')), alvo = posicao($('pillEstrelas').querySelector('svg')), n = ESTRELAS_RECOMPENSA;
  for(let k=0;k<n;k++){
    const f = document.createElement('div'); f.className = 'voa';
    f.innerHTML = `<svg viewBox="0 0 24 24" width="36" height="36"><path d="${STAR_D}" fill="#FBBF24" stroke="#F59E0B" stroke-width="1" stroke-linejoin="round"/></svg>`;
    f.style.left = (de.x-18)+'px'; f.style.top = (de.y-18)+'px'; $('app').appendChild(f);
    const dx = (k-(n-1)/2)*80;
    f.animate([
      {transform:'translate(0,0) scale(.3)',opacity:0},
      {transform:`translate(${dx}px,-80px) scale(1.6) rotate(20deg)`,opacity:1,offset:.35},
      {transform:`translate(${alvo.x-de.x}px,${alvo.y-de.y}px) scale(.5)`,opacity:1}
    ],{duration:1400,delay:800+k*400,easing:'ease-in-out',fill:'both'}).onfinish = ()=>{
      f.remove(); estrelas++; $('qtdEstrelas').textContent = estrelas; vibrar(40);
      const p = $('pillEstrelas'); p.classList.remove('bump'); void p.offsetWidth; p.classList.add('bump');
    };
  }
}
function confete(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const o = posicao($('gato')), cores = ['#FBBF24','#2563EB','#C4D2FF','#38BDF8'];
  for(let k=0;k<18;k++){
    const c = document.createElement('i'); c.className = 'conf'; c.style.background = cores[k%4];
    c.style.left = o.x+'px'; c.style.top = (o.y-60)+'px'; $('app').appendChild(c);
    const a = -Math.PI*(.1+.8*Math.random()), d = 70+Math.random()*70;
    c.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+90}px) rotate(260deg)`,opacity:0}],
      {duration:1400+Math.random()*600,delay:k*40,easing:'ease-out'}).onfinish = ()=>c.remove();
  }
}
$('voltar').addEventListener('click', ()=>{ if(URL_VOLTAR!=='#') location.href = URL_VOLTAR; parent.postMessage({lumis:'voltar'},'*'); });
document.addEventListener('visibilitychange', ()=>{ if(document.hidden && ouvindo) parar(false); });
</script>
