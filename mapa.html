<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa de Missões</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #26337a;
    --ink-soft: #3f4b8c;
    --page: #cfe4fb;
    --gold-1: #ffd75e;
    --gold-2: #ffab1f;
    --gold-lip: #c9780a;
    --lav-1: #a7b5f4;
    --lav-2: #7585e0;
    --lav-lip: #5262bf;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root:not([data-theme="light"]) { color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --page: #0e1a3c; }
  }
  :root[data-theme="dark"] { --page: #0e1a3c; }

  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%;
    margin: 0;
    background: var(--page);
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
  }

  .scroller {
    height: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    display: flex;
    align-items: center;
    justify-content: flex-start;
  }
  .stage {
    --node: clamp(46px, 4.9cqw, 88px);
    position: relative;
    flex: none;
    margin-inline: auto;
    width: min(100%, calc(100dvh * 1698 / 926));
    min-width: 900px;
    aspect-ratio: 1698 / 926;
    container-type: inline-size;
    user-select: none;
    -webkit-user-select: none;
  }
  .bg { display: block; width: 100%; height: 100%; -webkit-user-drag: none; }
  .trail { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* ---------- Título ---------- */
  .heading { position: absolute; left: 4cqw; top: 1.8cqw; display: flex; align-items: center; gap: 1cqw; }
  .mascote {
    display: block;
    flex: none;
    width: clamp(28px, 3.6cqw, 62px);
    height: auto;
    filter: drop-shadow(0 .3cqw .5cqw rgba(38, 51, 122, .28));
    pointer-events: none;
  }
  .heading h1 {
    margin: 0;
    font-family: "Fredoka", "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 4.5cqw, 80px);
    line-height: 1;
    letter-spacing: .005em;
    color: var(--ink);
    -webkit-text-stroke: .2em #fff;
    paint-order: stroke fill;
    filter: drop-shadow(0 .06em 0 rgba(38, 51, 122, .22));
  }

  /* ---------- Bolinhas das ilhas ---------- */
  .node {
    position: absolute;
    left: var(--x);
    top: var(--y);
    width: var(--node);
    height: var(--node);
    transform: translate(-50%, -50%);
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .node:focus-visible { outline: 3px solid var(--ink); outline-offset: 5px; }
  .disc {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: calc(var(--node) * .075) solid #fff;
    transition: transform .15s ease;
  }
  .disc::after { /* brilho */
    content: "";
    position: absolute;
    left: 16%; right: 16%; top: 7%; height: 32%;
    border-radius: 50%;
    background: linear-gradient(rgba(255,255,255,.55), rgba(255,255,255,0));
    pointer-events: none;
  }
  .node:hover .disc { transform: translateY(-2%) scale(1.07); }
  .node:active .disc { transform: translateY(4%) scale(.97); }
  .disc svg { width: 50%; height: 50%; position: relative; z-index: 1; }

  .node.open .disc {
    background: radial-gradient(circle at 50% 30%, var(--gold-1), var(--gold-2));
    box-shadow: 0 calc(var(--node) * .1) 0 var(--gold-lip), 0 calc(var(--node) * .22) calc(var(--node) * .3) rgba(38, 51, 122, .28);
  }
  .node.open .disc svg { filter: drop-shadow(0 .06em 0 rgba(160, 90, 0, .55)); }
  .node.open::before { /* pulso: a única animação contínua */
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: rgba(255, 190, 40, .6);
    animation: ping 2.3s ease-out infinite;
  }
  @keyframes ping { from { transform: scale(1); opacity: .85; } to { transform: scale(2); opacity: 0; } }

  .node.locked .disc {
    background: radial-gradient(circle at 50% 30%, var(--lav-1), var(--lav-2));
    box-shadow: 0 calc(var(--node) * .1) 0 var(--lav-lip), 0 calc(var(--node) * .22) calc(var(--node) * .3) rgba(38, 51, 122, .24);
  }
  .node.shake .disc { animation: shake .42s ease; }
  @keyframes shake {
    20% { transform: translateX(-9%) rotate(-6deg); }
    40% { transform: translateX(8%) rotate(5deg); }
    60% { transform: translateX(-5%) rotate(-3deg); }
    80% { transform: translateX(3%) rotate(2deg); }
  }

  .tag {
    position: absolute;
    left: 50%;
    bottom: calc(100% + .7cqw);
    transform: translateX(-50%);
    padding: .2em .85em .25em;
    white-space: nowrap;
    background: rgba(255, 255, 255, .94);
    border-radius: 99px;
    box-shadow: 0 .16cqw 0 rgba(38, 51, 122, .16);
    font: 600 clamp(12px, 1.35cqw, 22px)/1.2 "Fredoka", system-ui, sans-serif;
    color: var(--ink);
    pointer-events: none;
  }
  .node.locked .tag { color: #56639f; }

  /* ---------- Balão de aviso ---------- */
  .pop {
    --px: 0%; --py: 0%;
    position: absolute;
    left: var(--px);
    top: calc(var(--py) + var(--node) / 2 + .9cqw);
    transform: translateX(-50%);
    z-index: 5;
    width: clamp(190px, 17.5cqw, 320px);
    padding: .9cqw 1.1cqw 1cqw;
    background: #fff;
    border-radius: clamp(14px, 1.5cqw, 24px);
    box-shadow: 0 .25cqw 0 rgba(38, 51, 122, .14), 0 1.2cqw 2.4cqw rgba(38, 51, 122, .22);
    text-align: center;
    animation: pop-in .18s ease-out;
  }
  .pop[hidden] { display: none; }
  .pop::before {
    content: "";
    position: absolute;
    left: 50%; top: -.55cqw;
    width: 1.1cqw; height: 1.1cqw;
    background: #fff;
    transform: translateX(-50%) rotate(45deg);
    border-radius: .2cqw;
  }
  @keyframes pop-in { from { opacity: 0; transform: translateX(-50%) translateY(-6px); } }
  .pop h3 { margin: 0 0 .25em; font: 600 clamp(14px, 1.6cqw, 26px)/1.15 "Fredoka", system-ui, sans-serif; color: var(--ink); }
  .pop p { margin: 0; font: 700 clamp(12px, 1.2cqw, 19px)/1.35 "Nunito", system-ui, sans-serif; color: var(--ink-soft); }
  .pop .go {
    margin-top: .8cqw;
    padding: .35em 1.5em .45em;
    border: 0;
    border-radius: 99px;
    background: linear-gradient(var(--gold-1), var(--gold-2));
    box-shadow: 0 .2cqw 0 var(--gold-lip);
    font: 600 clamp(13px, 1.45cqw, 23px)/1.2 "Fredoka", system-ui, sans-serif;
    color: #4a2a00;
    cursor: pointer;
  }
  .pop .go:active { transform: translateY(.15cqw); box-shadow: 0 .05cqw 0 var(--gold-lip); }
  .pop .go:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }


  /* ---------- Gatinho no balão ---------- */
  .cat {
    position: absolute;
    right: 1.3cqw;
    bottom: calc(100% - 1.05cqw);
    width: clamp(56px, 5.8cqw, 100px);
    height: auto;
    pointer-events: none;
    filter: drop-shadow(0 .15cqw 0 rgba(38, 51, 122, .12));
  }

  /* ---------- Aviso inferior direito ---------- */
  .notice {
    position: absolute;
    right: 2.8cqw;
    bottom: 3.6cqw;
    display: flex;
    align-items: center;
    gap: 1.3cqw;
    padding: 1.2cqw 1.4cqw 1.2cqw 1.9cqw;
    background: rgba(255, 255, 255, .95);
    border-radius: clamp(18px, 2.4cqw, 40px);
    box-shadow: 0 .3cqw 0 rgba(38, 51, 122, .13), 0 1.4cqw 2.8cqw rgba(38, 51, 122, .18);
  }
  .notice h2 { margin: 0 0 .15em; font: 600 clamp(15px, 1.8cqw, 30px)/1.1 "Fredoka", system-ui, sans-serif; color: var(--ink); }
  .notice p { margin: 0; max-width: 17cqw; font: 700 clamp(12px, 1.25cqw, 20px)/1.35 "Nunito", system-ui, sans-serif; color: var(--ink-soft); }
  .next {
    position: relative;
    flex: none;
    width: clamp(46px, 5.4cqw, 92px);
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: calc(clamp(46px, 5.4cqw, 92px) * .07) solid #fff;
    background: radial-gradient(circle at 50% 30%, var(--lav-1), var(--lav-2));
    box-shadow: 0 .4cqw 0 var(--lav-lip), 0 .9cqw 1.4cqw rgba(38, 51, 122, .22);
  }
  .next > svg { width: 56%; height: 56%; filter: drop-shadow(0 .05em 0 rgba(50, 60, 150, .5)); }
  .next .badge {
    position: absolute;
    right: -14%; top: -14%;
    width: 42%; aspect-ratio: 1;
    display: grid; place-items: center;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 .12cqw 0 rgba(38, 51, 122, .2);
  }
  .next .badge svg { width: 58%; height: 58%; }

  @media (prefers-reduced-motion: reduce) {
    .node.open::before { animation: none; opacity: .35; transform: scale(1.35); }
    .node.shake .disc, .pop { animation: none; }
    .disc { transition: none; }
  }
</style>
</head>

    <div id="nodes"></div>
    <div class="pop" id="pop" role="status" aria-live="polite" hidden></div>

    <aside class="notice" aria-label="Aviso sobre a próxima ilha">
      <div>
        <h2>Próxima ilha</h2>
        <p>Desbloqueie todas as fases desta ilha antes de ir para a próxima.</p>
      </div>
      <div class="next" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
        <span class="badge"><svg viewBox="0 0 24 24"><rect x="5.5" y="10.5" width="13" height="10" rx="2.6" fill="#6f7fdc"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" fill="none" stroke="#6f7fdc" stroke-width="2.6" stroke-linecap="round"/></svg></span>
      </div>
    </aside>

</div>

<script>
  // Edite aqui: nomes, posições (em pixels da imagem 1698x926) e quais ilhas estão liberadas.
  const ISLANDS = [
    { id: 1, nome: "Ssss", x: 300,  y: 372, liberada: true  },
    { id: 2, nome: "Mmmm", x: 729,  y: 274, liberada: false },
    { id: 3, nome: "Brrr", x: 1090, y: 208, liberada: false },
    { id: 4, nome: "Shhh", x: 1466, y: 97,  liberada: false }
  ];

  // Conecte aqui a abertura das fases da ilha (ex.: navegar para a tela de fases).
  window.abrirIlha = window.abrirIlha || function (ilha) {
    document.dispatchEvent(new CustomEvent("ilha:abrir", { detail: ilha }));
  };

  const W = 1698, H = 926;
  const nodesEl = document.getElementById("nodes");
  const pop = document.getElementById("pop");
  let timer = null;

  const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12 2.8 14.7 9 21.4 9.6 16.3 14 17.9 20.6 12 17.1 6.1 20.6 7.7 14 2.6 9.6 9.3 9" fill="#fff" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>';
  const LOCK = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5.2" y="10.4" width="13.6" height="10.4" rx="2.8" fill="#fff"/><path d="M8.4 10.6V8a3.6 3.6 0 0 1 7.2 0v2.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><circle cx="12" cy="15" r="1.5" fill="#7585e0"/><rect x="11.2" y="15.4" width="1.6" height="2.8" rx=".8" fill="#7585e0"/></svg>';


  const OUT = "#8393cf", FUR = "#ffffff", INK = "#26337a", IRIS = "#4aa3ff", IRIS_D = "#2b78d6";
  function olho(cx, cy) {
    return '<ellipse cx="' + cx + '" cy="' + cy + '" rx="5.6" ry="6.4" fill="' + IRIS + '" stroke="' + IRIS_D + '" stroke-width="1.2"/>'
      + '<ellipse cx="' + cx + '" cy="' + (cy + .6) + '" rx="2.7" ry="4.1" fill="' + INK + '"/>'
      + '<circle cx="' + (cx + 1.9) + '" cy="' + (cy - 2.2) + '" r="1.8" fill="#fff"/>'
      + '<circle cx="' + (cx - 1.8) + '" cy="' + (cy + 2.6) + '" r=".9" fill="#fff" opacity=".9"/>';
  }
  function catSVG(humor) {
    const feliz = humor !== "triste";
    const dy = feliz ? 42 : 44;
    const olhos = olho(35, dy) + olho(65, dy)
      + (feliz ? '' : '<path d="M27 37 L41 32 M73 37 L59 32" stroke="' + OUT + '" stroke-width="2.4" stroke-linecap="round"/>');
    const boca = feliz
      ? '<path d="M50 54 q-3.5 6 -9 3 M50 54 q3.5 6 9 3" fill="none" stroke="' + OUT + '" stroke-width="2.2" stroke-linecap="round"/>'
      : '<path d="M43 60 q7 -6 14 0" fill="none" stroke="' + OUT + '" stroke-width="2.2" stroke-linecap="round"/>';
    return '<svg class="cat" viewBox="0 0 100 80" aria-hidden="true">'
      + '<path d="M17 32 L20 6 L43 19 Z" fill="' + FUR + '" stroke="' + OUT + '" stroke-width="3.6" stroke-linejoin="round"/>'
      + '<path d="M83 32 L80 6 L57 19 Z" fill="' + FUR + '" stroke="' + OUT + '" stroke-width="3.6" stroke-linejoin="round"/>'
      + '<path d="M23 25 L24.5 13 L35 19 Z" fill="#ffc2d1" stroke="#ffc2d1" stroke-width="2" stroke-linejoin="round"/>'
      + '<path d="M77 25 L75.5 13 L65 19 Z" fill="#ffc2d1" stroke="#ffc2d1" stroke-width="2" stroke-linejoin="round"/>'
      + '<ellipse cx="50" cy="42" rx="38" ry="28" fill="' + FUR + '" stroke="' + OUT + '" stroke-width="2.2"/>'
      + '<path d="M50 16.5 v6 M42 18.5 l1.6 5 M58 18.5 l-1.6 5" stroke="#d3dbf3" stroke-width="2.6" stroke-linecap="round" fill="none"/>'
      + '<ellipse cx="50" cy="55" rx="15" ry="9.5" fill="#f1f4ff"/>'
      + '<ellipse cx="24.5" cy="53" rx="5.2" ry="3.2" fill="#ffa6bb" opacity=".6"/><ellipse cx="75.5" cy="53" rx="5.2" ry="3.2" fill="#ffa6bb" opacity=".6"/>'
      + olhos
      + '<path d="M46.2 48.5 h7.6 l-3.8 4.2 z" fill="#ff8fa9" stroke="#ff8fa9" stroke-width="1.6" stroke-linejoin="round"/>'
      + boca
      + '<path d="M15 47 l-11 -2.5 M15 53 l-11 3 M85 47 l11 -2.5 M85 53 l11 3" stroke="' + OUT + '" stroke-opacity=".8" stroke-width="1.6" stroke-linecap="round"/>'
      + '<ellipse cx="29" cy="72" rx="11" ry="7" fill="' + FUR + '" stroke="' + OUT + '" stroke-width="2.2"/>'
      + '<ellipse cx="71" cy="72" rx="11" ry="7" fill="' + FUR + '" stroke="' + OUT + '" stroke-width="2.2"/>'
      + '<path d="M25 74 v-3 M29 75 v-4 M33 74 v-3 M67 74 v-3 M71 75 v-4 M75 74 v-3" stroke="' + OUT + '" stroke-opacity=".6" stroke-width="1.4" stroke-linecap="round"/>'
      + '</svg>';
  }

  function hidePop() {
    clearTimeout(timer);
    pop.hidden = true;
  }

  function showPop(ilha, html, autoHideMs, humor) {
    clearTimeout(timer);
    pop.style.setProperty("--px", (ilha.x / W * 100) + "%");
    pop.style.setProperty("--py", (ilha.y / H * 100) + "%");
    pop.innerHTML = catSVG(humor) + html;
    pop.hidden = false;
    pop.style.animation = "none"; void pop.offsetWidth; pop.style.animation = "";
    if (autoHideMs) timer = setTimeout(hidePop, autoHideMs);
  }

  ISLANDS.forEach((ilha, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "node " + (ilha.liberada ? "open" : "locked");
    b.style.setProperty("--x", (ilha.x / W * 100) + "%");
    b.style.setProperty("--y", (ilha.y / H * 100) + "%");
    b.setAttribute("aria-label", ilha.nome + (ilha.liberada ? ", liberada" : ", bloqueada"));
    b.innerHTML = '<span class="disc">' + (ilha.liberada ? STAR : LOCK) + '</span><span class="tag">' + ilha.nome + '</span>';

    b.addEventListener("click", (e) => {
      e.stopPropagation();
      if (ilha.liberada) {
        showPop(ilha,
          '<h3>' + ilha.nome + '</h3><p> Hora de começar as fases!</p><button class="go" type="button">Começar</button>');
        pop.querySelector(".go").addEventListener("click", () => {
          pop.innerHTML = catSVG('feliz') + '<h3>' + ilha.nome + '</h3><p>Abrindo as fases…</p>';
          window.abrirIlha(ilha);
          timer = setTimeout(hidePop, 1600);
        });
      } else {
        const anterior = ISLANDS[i - 1];
        showPop(ilha,
          '<h3>' + ilha.nome + ' bloqueada</h3><p>Desbloqueie todas as fases de “' + anterior.nome + '” para entrar aqui.</p>', 3600, 'triste');
        b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
        b.addEventListener("animationend", () => b.classList.remove("shake"), { once: true });
      }
    });
    nodesEl.appendChild(b);
  });

  document.addEventListener("click", (e) => { if (!e.target.closest(".pop")) hidePop(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") hidePop(); });

</script>
